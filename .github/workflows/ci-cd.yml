name: CI/CD

on:
  push:
    branches: [main, devops/deployment]
  pull_request:
    branches: [main]

env:
  IMAGE_APP: ghcr.io/rafifrn/crud-njajan-app
  IMAGE_WEB: ghcr.io/rafifrn/crud-njajan-web

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, zip, gd
          coverage: none

      - name: Cache vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependency
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Test (Pest)
        run: vendor/bin/pest

  build:
    name: Build & Push Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ github.sha }}
            ${{ env.IMAGE_APP }}:latest
          cache-from: type=gha,scope=njajan
          cache-to: type=gha,mode=max,scope=njajan

      - name: Build & push image web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=njajan
  deploy:
    name: Deploy ke VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://njajan.zhafran.web.id
    steps:
      - uses: actions/checkout@v4

      - name: Kirim docker-compose.yml ke VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/njajan

      - name: Pull image baru & restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/njajan
            export APP_IMAGE=ghcr.io/rafifrn/crud-njajan-app:${{ github.sha }}
            export WEB_IMAGE=ghcr.io/rafifrn/crud-njajan-web:${{ github.sha }}
            docker compose pull app web
            docker compose up -d --no-build
            docker compose exec -T app php artisan migrate --force
            docker image prune -f

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://njajan.zhafran.web.id/up)
            if [ "$code" = "200" ]; then echo "Situs sehat (HTTP $code)"; exit 0; fi
            echo "Percobaan $i: HTTP $code, tunggu 5 detik..."; sleep 5
          done
          echo "Smoke test gagal"; exit 1
